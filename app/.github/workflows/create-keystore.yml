name: Create Keystore (ONE TIME ONLY)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore aylin-release.jks -alias aylin -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Aylin Bakery, O=Aylin, C=IR"
          mkdir out
          base64 -w0 aylin-release.jks > out/KEYSTORE_BASE64.txt
          printf 'KEYSTORE_PASSWORD=%s\nKEY_PASSWORD=%s\nKEY_ALIAS=aylin\n' "$PASS" "$PASS" > out/passwords.txt
          mv aylin-release.jks out/

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-KEEP-SAFE
          path: out/*
          retention-days: 1
