name: Build Aylin v2 Release APK

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: app
        run: flutter create --platforms=android --org=ir.factoori --project-name=aylin_bakery .

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Remove template test from generated Flutter scaffold
        working-directory: app
        run: rm -rf test

      - name: Analyze Dart sources
        working-directory: app
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Build Release APK
        working-directory: app
        run: flutter build apk --release

      - name: Collect APK
        run: |
          set -e
          mkdir -p output
          cp app/build/app/outputs/flutter-apk/app-release.apk output/aylin-bakery-v2.apk
          test -s output/aylin-bakery-v2.apk
          ls -lh output/aylin-bakery-v2.apk
          sha256sum output/aylin-bakery-v2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aylin-bakery-v2-release-candidate
          path: output/aylin-bakery-v2.apk
          if-no-files-found: error
          retention-days: 30
