name: Build Aylin Release APK

on:
  push:
    paths:
      - "aylin_bakery.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter project
        shell: bash
        run: |
          set -e
          mkdir -p project
          unzip -q aylin_bakery.zip -d project
          APP_DIR="$(dirname "$(find project -type f -name pubspec.yaml -print -quit)")"
          if [ -z "$APP_DIR" ] || [ "$APP_DIR" = "." ]; then
            echo "pubspec.yaml not found in archive"
            exit 2
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $APP_DIR"
          echo "===== Project files ====="
          find "$APP_DIR" -maxdepth 3 -type f | sort | head -160
          echo "===== Dart source inventory ====="
          find "$APP_DIR/lib" -type f -name '*.dart' -print | sort

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Android platform files
        working-directory: ${{ env.APP_DIR }}
        run: flutter create --platforms=android --org=ir.factoori .

      - name: Resolve Flutter dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Fix cake label field mismatch
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          sed -i 's/lv.cake/lv.title/g' lib/play.dart
          ! grep -n 'lv\\.cake' lib/play.dart

      - name: Print game source for review
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          for f in lib/main.dart lib/home.dart lib/play.dart lib/data.dart; do
            if [ -f "$f" ]; then
              echo "===== SOURCE: $f ====="
              sed -n '1,420p' "$f"
            fi
          done
          echo "===== APP CONFIG ====="
          cat pubspec.yaml
          echo "===== ANDROID PACKAGE / SIGNING CONFIG ====="
          grep -R -n -E 'applicationId|namespace|signingConfig|versionCode|versionName' android/app 2>/dev/null || true

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release

      - name: Collect release APK
        shell: bash
        run: |
          set -e
          mkdir -p output
          cp "$APP_DIR/build/app/outputs/flutter-apk/app-release.apk" output/aylin-game-release.apk
          test -s output/aylin-game-release.apk
          ls -lh output
          sha256sum output/aylin-game-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: aylin-game-release-apk
          path: output/aylin-game-release.apk
          if-no-files-found: error
          retention-days: 30
