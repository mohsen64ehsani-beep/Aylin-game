name: Build Aylin APK

on:
  push:
    paths:
      - "aylin_bakery.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter project
        shell: bash
        run: |
          set -e
          mkdir -p project
          unzip -q aylin_bakery.zip -d project
          APP_DIR="$(dirname "$(find project -type f -name pubspec.yaml -print -quit)")"
          if [ -z "$APP_DIR" ] || [ "$APP_DIR" = "." ]; then
            echo "pubspec.yaml not found in archive"
            exit 2
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $APP_DIR"
          find "$APP_DIR" -maxdepth 3 -type f | sort | head -200

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Android platform files
        working-directory: ${{ env.APP_DIR }}
        run: flutter create --platforms=android --org=ir.factoori .

      - name: Resolve Flutter dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --debug

      - name: Collect APK
        shell: bash
        run: |
          set -e
          mkdir -p output
          find "$APP_DIR/build/app/outputs/flutter-apk" -maxdepth 1 -type f -name "*.apk" -exec cp {} output/ \;
          test -n "$(find output -type f -name '*.apk' -print -quit)"
          ls -lh output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aylin-game-debug-apk
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7
